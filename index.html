
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Shooting Log 3.3</title>
<style>
*{box-sizing:border-box}
body{margin:auto;max-width:900px;padding:18px;background:#192522;color:#fff;font:16px Arial,sans-serif}
h1,h2{color:#efb27b}
nav{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}
button{background:#36534a;color:white;border:0;border-radius:9px;padding:12px;cursor:pointer;font:inherit}
.primary{background:#efb27b;color:#192522;font-weight:bold}
section,article{background:#293c35;padding:18px;border-radius:14px;margin:12px 0}
input,textarea,select{width:100%;padding:12px;background:#192522;color:white;border:1px solid #72847a;border-radius:8px;font:inherit}
label{display:block;margin:12px 0 6px}
img{max-width:100%;border-radius:8px;margin:12px 0}
small{color:#b9c8c1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metric{font-size:30px;color:#efb27b}
footer{text-align:center;margin:25px 0}
@media print{nav,button,form{display:none}body,section,article{background:white;color:black}h1,h2{color:black}}
dialog{background:#293c35;color:white;border:1px solid #72847a;border-radius:14px;max-width:95vw;max-height:95vh}dialog img{max-height:75vh;object-fit:contain;cursor:zoom-in} .actions{display:flex;gap:8px;flex-wrap:wrap} @media print{.actions,footer{display:none} article{break-inside:avoid} small{color:black}}
.calendarGrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center;margin:12px 0}.day{background:#192522;border-radius:5px;padding:8px 2px}.day small{color:#efb27b;display:block}
nav button{flex:1 1 auto} .avatar{width:100px;height:100px;object-fit:cover;border-radius:50%}.day.today{outline:2px solid #efb27b}.day.event{background:#36534a}.summary{color:#efb27b;font-weight:bold}.actions{align-items:center}@media(max-width:450px){body{padding:12px}section,article{padding:12px}.metric{font-size:24px}nav button{padding:10px}}
</style>
</head>
<body>
<h1>MY SHOOTING LOG</h1>
<p>Version 3.3 — Mobile Edition</p>
<nav>
<button onclick="show('home')">Accueil</button>
<button onclick="show('session')">Séance</button>
<button onclick="show('history')">Historique</button>
<button onclick="show('photos')">Photos</button>
<button onclick="show('budget')">Budget</button>
<button onclick="show('agenda')">Agenda</button>
<button onclick="show('profile')">Mon profil</button>
<button onclick="show('backup')">Sauvegarde</button><button onclick="show('help')">Aide</button>
</nav>
<main id="main"></main><dialog id="viewer"><button onclick="this.parentElement.close()">Fermer</button><div style="overflow:auto"><img id="largePhoto" alt="Photographie agrandie" onclick="this.style.maxHeight=this.style.maxHeight==='none'?'75vh':'none';this.style.maxWidth=this.style.maxWidth==='none'?'100%':'none'"></div></dialog>
<footer><small>My Shooting Log — 2026</small></footer>
<script>
const main=document.getElementById('main');
let data={sessions:[],photos:[],expenses:[],agenda:[]};
try{
const saved=localStorage.getItem('msl3');
if(saved)data=JSON.parse(saved);
}catch(e){}
function save(){
try{
localStorage.setItem('msl3',JSON.stringify(data));
return true;
}catch(e){
alert('Stockage indisponible ou plein. Exportez une sauvegarde.');
return false;
}
}
function esc(s){
return String(s??'').replace(/[&<>"']/g,c=>({
'&':'&amp;','<':'&lt;','>':'&gt;',
'"':'&quot;',"'":'&#39;'
}[c]));
}
function today(){
const d=new Date();
return d.getFullYear()+'-'+
String(d.getMonth()+1).padStart(2,'0')+'-'+
String(d.getDate()).padStart(2,'0');
}
let editing=null;
function show(page){
if(page!=='session')editing=null;
if(page==='home'){
main.innerHTML=`
<div class="grid">
<section>Séances<div class="metric">${data.sessions.length}</div></section>
<section>Photos<div class="metric">${data.photos.length}</div></section>
<section>Dépenses<div class="metric">${data.expenses.reduce((s,e)=>s+Number(e.amount),0).toFixed(2)} €</div></section>
<section>Échéances<div class="metric">${data.agenda.length}</div></section>
</div>
<section>
${avatar(data.profile)}<h2>Bienvenue${data.profile?.first ? ", "+esc(data.profile.first) : " dans votre carnet"}</h2>
${upcoming()}<button class="primary" onclick="show('session')">Nouvelle séance</button>
<button onclick="show('photos')">Ajouter une photo</button>
</section>`;
}
if(page==='session'){
main.innerHTML=`
<section><h2>Nouvelle séance</h2>
<form onsubmit="add(event,'sessions','history')">
<label>Date</label>
<input name="date" type="date" value="${today()}" required>
<label>Heure</label>
<input name="time" type="time" value="${new Date().toTimeString().slice(0,5)}" required>
<label>Club</label>
<input name="club" required>
<label>Matériel utilisé</label>
<input name="equipment">
<label>Calibre</label>
<input name="calibre">
<label>Nombre de cartouches déclaré</label>
<input name="count" type="number" min="0">
<label>Durée en minutes</label>
<input name="duration" type="number" min="0">
<label>Score déclaré</label>
<input name="score"><label>Addition de résultats déclarés (facultatif)</label><input id="scoreParts" placeholder="Ex. 12 + 15 + 18"><button type="button" onclick="sumScore()">Calculer le total</button>
<label>Observations</label>
<textarea name="notes" rows="4"></textarea>
<label>Incidents signalés</label>
<textarea name="incident"></textarea>
<label>Commentaires du moniteur</label>
<textarea name="instructor"></textarea>
<br><br>
<button class="primary">Enregistrer</button>
</form></section>`;
if(editing!==null){const f=main.querySelector('form');const item=data.sessions[editing];for(const el of f.elements){if(el.name&&item[el.name]!=null)el.value=item[el.name];}main.querySelector('h2').textContent='Modifier la séance';}
}
if(page==='history'){
main.innerHTML='<h2>Historique</h2><p>'+esc([data.profile?.first,data.profile?.last].filter(Boolean).join(' '))+'</p><button onclick="window.print()">Imprimer / PDF</button>'+
data.sessions.map((s,i)=>`<article id="session-${i}">
<strong>${esc(s.date)} — ${esc(s.time)}</strong>
<p>${esc(s.club)}</p>
<p>${esc(s.equipment)} — ${esc(s.calibre)}</p>
<p>Cartouches déclarées : ${esc(s.count)}</p>
<p>Durée : ${esc(s.duration)} min</p>
<p>Score déclaré : ${esc(s.score)}</p>
<p>${esc(s.notes)}</p>
<p>${esc(s.incident)}</p>
<p>${esc(s.instructor)}</p>
${data.photos.filter(p=>p.session===s.id).map(p=>`<img src="${p.image}"><p>${esc(p.note)}</p>`).join('')}
<div class="actions"><button onclick="editSession(${i})">Modifier</button><button onclick="deleteSession(${i})">Supprimer</button><button onclick="printSession(${i})">Fiche PDF</button></div></article>`).join('');
}
if(page==='photos'){
main.innerHTML=`
<section><h2>My Target — Album</h2>
<label>Séance associée</label>
<select id="association">
<option value="">Photo indépendante</option>
${data.sessions.map(s=>`<option value="${esc(s.id)}">${esc(s.date)} — ${esc(s.equipment)}</option>`).join('')}
</select>
<label>Importer une photographie</label>
<input type="file" accept="image/*" onchange="loadPhoto(this)">
<label>Prendre une photographie</label>
<input type="file" accept="image/*" capture="environment" onchange="loadPhoto(this)">
<canvas id="preview" style="display:none;max-width:100%"></canvas>
<label>Rotation</label>
<button onclick="rotatePhoto()">Tourner de 90°</button>
<label>Luminosité</label>
<input id="light" type="range" min="50" max="150" value="100" oninput="drawPhoto()">
<label>Contraste</label>
<input id="contrast" type="range" min="50" max="150" value="100" oninput="drawPhoto()">
<label>Catégorie du document</label>
<select id="photoCategory">
<option>Photographie de séance</option>
<option>Emballage - recto</option>
<option>Emballage - verso</option>
<option>Étiquette</option>
<option>Autre document</option>
</select>

<label>Commentaires</label>
<textarea id="comment"></textarea>
<br><br>
<button class="primary" onclick="archivePhoto()">Archiver la photo</button>
</section>
<h2>Photographies enregistrées</h2><label>Filtrer par catégorie</label><select onchange="filterPhotos(this.value)"><option value="">Toutes</option>${[...new Set(data.photos.map(p=>p.category||'Sans catégorie'))].map(c=>`<option>${esc(c)}</option>`).join('')}</select>
${data.photos.map((p,i)=>`<article class="photoEntry" data-category="${esc(p.category||'Sans catégorie')}"><small>${esc(p.date)} — ${esc(p.category || 'Sans catégorie')}</small><br><img src="${p.image}" onclick="viewPhoto(${i})" alt="Photographie archivée"><p>${esc(p.note)}</p><button onclick="viewPhoto(${i})">Agrandir</button> </article>`).join('')}`;
source=null;angle=0;
}
if(page==='budget'){
 main.innerHTML=`<section><h2>Budget</h2><label>Année</label><input id="budgetYear" type="number" min="1900" max="2200" value="${budgetYear}" onchange="budgetYear=this.value;renderBudget()"><label>Mois (facultatif)</label><select id="budgetMonth" onchange="budgetMonth=this.value;renderBudget()"><option value="">Tous les mois</option>${Array.from({length:12},(_,i)=>`<option value="${String(i+1).padStart(2,'0')}" ${budgetMonth===String(i+1).padStart(2,'0')?'selected':''}>${new Date(2020,i,1).toLocaleDateString('fr',{month:'long'})}</option>`).join('')}</select><div id="budgetResults"></div></section><section><h2 id="expenseTitle">Nouvelle dépense</h2><form id="expenseForm" onsubmit="saveExpense(event)"><label>Date</label><input name="date" type="date" value="${today()}" required><label>Libellé</label><input name="label" required><label>Montant (€)</label><input name="amount" type="number" min="0" step="0.01" required><br><br><button class="primary">Enregistrer</button><button type="button" onclick="expenseEdit=null;show('budget')">Annuler</button></form></section>`;expenseEdit=null;renderBudget();}
if(page==='agenda'){
main.innerHTML=`
<section><h2>Agenda administratif</h2><div id="calendar"></div>
<form onsubmit="add(event,'agenda','agenda')">
<label>Échéance</label>
<input name="label" required>
<label>Catégorie</label><select name="category"><option>Autre</option><option>Cotisation</option><option>Document administratif</option><option>Rendez-vous</option></select>
<label>Date</label>
<input name="date" type="date" required>
<br><br><button class="primary">Ajouter</button>
</form></section>
${[...data.agenda].sort((a,b)=>a.date.localeCompare(b.date)).map(e=>`<article>${esc(e.date)} — ${esc(e.label)} ${e.category?' — '+esc(e.category):''} <button onclick="removeAgenda(${data.agenda.indexOf(e)})">Supprimer</button></article>`).join('')}`;
 renderCalendar();
}
 if(page==='profile'){
 const p=data.profile||{};
 main.innerHTML=`<section><h2>Mon profil personnel</h2>${avatar(p)}<form onsubmit="saveProfile(event)"><label>Prénom</label><input name="first" value="${esc(p.first)}"><label>Nom</label><input name="last" value="${esc(p.last)}"><label>E-mail (facultatif)</label><input type="email" name="email" value="${esc(p.email)}"><label>Photographie de profil</label><input type="file" accept="image/*" onchange="profileImage(this)"><button type="button" onclick="clearAvatar()">Retirer la photo</button><br><br><button class="primary">Enregistrer mon profil</button></form><small>Informations locales et facultatives. Les sauvegardes ne sont pas chiffrées.</small></section><section><h2>Mes affiliations personnelles</h2><div id="affiliations"></div><form id="affForm" onsubmit="saveAff(event)"><label>Nom du club ou organisme</label><input name="club" list="personalClubs" value="${esc(p.club)}" required><datalist id="personalClubs">${[...new Set([p.club,...affiliations().map(a=>a.club)].filter(Boolean))].map(c=>`<option value="${esc(c)}"></option>`).join('')}</datalist><label>Fédération</label><input name="federation"><label>Numéro officiel du club</label><input name="clubNumber"><label>Numéro personnel de membre</label><input name="memberNumber"><label>Numéro d’affiliation à la fédération</label><input name="federationNumber"><label>Renouvellement</label><input name="renewal" type="date"><label>Cotisation annuelle (€)</label><input name="fee" type="number" min="0" step="0.01"><br><br><button class="primary">Enregistrer l’affiliation</button><button type="button" onclick="show('profile')">Annuler</button></form></section>`;pendingAvatar=p.avatar||'';affEdit=null;renderAff();}
 if(page==='help'){main.innerHTML=`<section><h2>Mode d’emploi</h2><p>Mon profil : personnalisez vos coordonnées et vos affiliations. Enregistrez chaque formulaire séparément.</p><p>Budget : sélectionnez une année ou un mois, ajoutez ou modifiez vos dépenses.</p><p>Agenda : consultez les échéances et cliquez sur un jour pour en afficher le détail.</p><p>Sauvegarde : exportez régulièrement un fichier JSON. Pour changer d’appareil, restaurez ce fichier. La restauration remplace les données actuelles.</p><p>Sur smartphone, utilisez le menu du navigateur pour ajouter un raccourci à l’écran d’accueil, si disponible.</p><p>Les données restent dans ce navigateur. Évitez la navigation privée et conservez vos sauvegardes hors de l’appareil.</p></section>`;}
if(page==='backup'){
main.innerHTML=`
<section><h2>Sauvegarde</h2>
<p>Conservez une copie de vos données et photographies.</p>
<button class="primary" onclick="exportData()">Exporter</button>
<label>Restaurer une sauvegarde</label>
<input type="file" accept=".json" onchange="restoreData(this)">
</section>`;
}
}
function add(e,key,page){
e.preventDefault();
const old=data[key].slice();const fields=Object.fromEntries(new FormData(e.target));
if(key==='sessions'&&editing!==null){data[key][editing]={...data[key][editing],...fields};}else{data[key].unshift({...fields,id:crypto.randomUUID()});}
if(save()){editing=null;show(page);}else{data[key]=old;}
}
let source=null,angle=0;
function loadPhoto(input){
if(!input.files.length)return;
const url=URL.createObjectURL(input.files[0]);
const im=new Image();
im.onload=()=>{
source=im;angle=0;drawPhoto();
URL.revokeObjectURL(url);
};
im.onerror=()=>{
URL.revokeObjectURL(url);
alert('Image illisible.');
};
im.src=url;
}
function rotatePhoto(){
angle=(angle+90)%360;drawPhoto();
}
function drawPhoto(){
if(!source)return;
const c=document.getElementById('preview');
if(!c)return;
const scale=Math.min(1,1400/Math.max(source.width,source.height));
const w=Math.round(source.width*scale);
const h=Math.round(source.height*scale);
c.width=angle%180?h:w;
c.height=angle%180?w:h;
const ctx=c.getContext('2d');
ctx.translate(c.width/2,c.height/2);
ctx.rotate(angle*Math.PI/180);
ctx.filter='brightness('+document.getElementById('light').value+'%) contrast('+document.getElementById('contrast').value+'%)';
ctx.drawImage(source,-w/2,-h/2,w,h);
c.style.display='block';
}
function archivePhoto(){
if(!source){alert('Choisissez une photo.');return;}
data.photos.unshift({
date:today(),
session:document.getElementById('association').value,
note:document.getElementById('comment').value,
category:document.getElementById('photoCategory').value,  
image:document.getElementById('preview').toDataURL('image/jpeg',0.75)
});
if(save()){alert('Photographie enregistrée.');show('photos');}else{data.photos.shift();}
}
function exportData(){
const url=URL.createObjectURL(new Blob(
[JSON.stringify(data)],{type:'application/json'}));
const a=document.createElement('a');
a.href=url;a.download='my-shooting-log-3.3-'+today()+'.json';
a.click();
setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function restoreData(input){
try{
const v=JSON.parse(await input.files[0].text());
if(!['sessions','photos','expenses','agenda'].every(k=>Array.isArray(v[k])))throw Error();
if(!v.photos.every(p=>typeof p.image==='string'&&/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(p.image)))throw Error();
if(confirm('Remplacer les données actuelles ?')){
const old=data;data=v;if(save())show('home');else data=old;
}
}catch(e){alert('Sauvegarde invalide.');}
}
function sumScore(){const v=document.getElementById('scoreParts').value.trim();if(!/^\d+(\s*\+\s*\d+)*$/.test(v)){alert('Saisissez des nombres séparés par +.');return;}main.querySelector('[name=score]').value=v.split('+').reduce((n,x)=>n+Number(x),0);}
function editSession(i){editing=i;show('session');}
function deleteSession(i){if(!confirm('Supprimer cette séance ? Les photos seront conservées.'))return;const old=data.sessions.slice();data.sessions.splice(i,1);if(save())show('history');else data.sessions=old;}
function printSession(i){const items=[...main.querySelectorAll('article')];items.forEach(a=>{if(a.id!=='session-'+i)a.hidden=true;});try{window.print();}finally{items.forEach(a=>a.hidden=false);}}
function viewPhoto(i){const img=document.getElementById('largePhoto');img.src=data.photos[i].image;img.style.maxHeight='75vh';img.style.maxWidth='100%';document.getElementById('viewer').showModal();}
function filterPhotos(c){document.querySelectorAll('.photoEntry').forEach(a=>a.hidden=!!c&&a.dataset.category!==c);}
function saveProfile(e){e.preventDefault();const old=data.profile;data.profile={...old,...Object.fromEntries(new FormData(e.target)),avatar:pendingAvatar};if(save())show('profile');else data.profile=old;}
function removeAgenda(i){if(!confirm('Supprimer cette échéance ?'))return;const old=data.agenda.slice();data.agenda.splice(i,1);if(save())show('agenda');else data.agenda=old;}
let calendarMonth=new Date();calendarMonth.setDate(1);
function moveMonth(n){calendarMonth.setMonth(calendarMonth.getMonth()+n);renderCalendar();}
function renderCalendar(){const el=document.getElementById('calendar');if(!el)return;const y=calendarMonth.getFullYear(),m=calendarMonth.getMonth(),start=(new Date(y,m,1).getDay()+6)%7,end=new Date(y,m+1,0).getDate();let cells=['L','M','M','J','V','S','D'].map(x=>'<b>'+x+'</b>').join('')+'<span></span>'.repeat(start);for(let d=1;d<=end;d++){const key=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');const entries=allDeadlines().filter(a=>a.date===key);cells+='<button type="button" onclick="calendarDetails(\''+key+'\')" class="day '+(key===today()?'today ':'')+(entries.length?'event':'')+'" title="'+esc(entries.map(a=>a.label).join(', '))+'">'+d+(entries.length?'<small> • '+entries.length+'</small>':'')+'</button>';}el.innerHTML='<div class="actions"><button type="button" onclick="moveMonth(-1)">‹</button><strong>'+calendarMonth.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})+'</strong><button type="button" onclick="moveMonth(1)">›</button></div><div class="calendarGrid">'+cells+'</div><div id="dayDetails"></div>';}
let pendingAvatar='',affEdit=null,expenseEdit=null,budgetYear=String(new Date().getFullYear()),budgetMonth='';
function avatar(p){return p&&/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(p.avatar||'')?`<img class="avatar" src="${p.avatar}" alt="Photo de profil">`:'';}
function profileImage(input){const file=input.files[0];if(!file)return;const url=URL.createObjectURL(file),im=new Image();im.onload=()=>{const c=document.createElement('canvas'),scale=Math.min(1,300/Math.max(im.width,im.height));c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));c.getContext('2d').drawImage(im,0,0,c.width,c.height);pendingAvatar=c.toDataURL('image/jpeg',.8);URL.revokeObjectURL(url);alert('Photo prête. Enregistrez votre profil.');};im.onerror=()=>{URL.revokeObjectURL(url);alert('Photo illisible');};im.src=url;}
function clearAvatar(){pendingAvatar='';alert('Enregistrez le profil pour retirer la photo.');}
function affiliations(){return Array.isArray(data.affiliations)?data.affiliations:[];}
function renderAff(){document.getElementById('affiliations').innerHTML=affiliations().map((a,i)=>`<article><strong>${esc(a.club)}</strong><p>${esc(a.federation)} — ${esc(a.renewal)}</p><p>Club : ${esc(a.clubNumber)} · Membre : ${esc(a.memberNumber)} · Fédération : ${esc(a.federationNumber)}</p><p>Cotisation : ${esc(a.fee)} €</p><button onclick="editAff(${i})">Modifier</button> <button onclick="deleteAff(${i})">Supprimer</button></article>`).join('');}
function saveAff(e){e.preventDefault();const old=data.affiliations,arr=affiliations().slice(),v=Object.fromEntries(new FormData(e.target));if(affEdit===null)arr.push(v);else arr[affEdit]=v;data.affiliations=arr;if(save())show('profile');else data.affiliations=old;}
function editAff(i){affEdit=i;const f=document.getElementById('affForm');for(const el of f.elements)if(el.name)el.value=affiliations()[i][el.name]||'';f.scrollIntoView();}
function deleteAff(i){if(!confirm('Supprimer cette affiliation ?'))return;const old=data.affiliations;data.affiliations=affiliations().filter((a,j)=>i!==j);if(save())show('profile');else data.affiliations=old;}
function allDeadlines(){return [...data.agenda,...affiliations().filter(a=>a.renewal).map(a=>({date:a.renewal,label:'Renouvellement : '+a.club}))];}
function upcoming(){const items=allDeadlines().filter(a=>a.date>=today()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3);return '<h3>Prochaines échéances</h3>'+ (items.map(a=>`<p>${esc(a.date)} — ${esc(a.label)}</p>`).join('')||'<p>Aucune échéance à venir.</p>');}
function calendarDetails(key){document.getElementById('dayDetails').innerHTML='<strong>'+esc(key)+'</strong>'+allDeadlines().filter(a=>a.date===key).map(a=>`<p>${esc(a.label)}</p>`).join('');}
function renderBudget(){const rows=data.expenses.map((e,i)=>({e,i})).filter(({e})=>String(e.date).startsWith(budgetYear+(budgetMonth?'-'+budgetMonth:'')));const total=rows.reduce((n,{e})=>n+Number(e.amount),0);document.getElementById('budgetResults').innerHTML=`<p class="summary">Total de la période : ${total.toFixed(2)} €</p>`+rows.map(({e,i})=>`<article>${esc(e.date)} — ${esc(e.label)} — ${Number(e.amount).toFixed(2)} €<div class="actions"><button onclick="editExpense(${i})">Modifier</button><button onclick="deleteExpense(${i})">Supprimer</button></div></article>`).join('');}
function editExpense(i){expenseEdit=i;const f=document.getElementById('expenseForm');for(const el of f.elements)if(el.name)el.value=data.expenses[i][el.name]??'';document.getElementById('expenseTitle').textContent='Modifier la dépense';f.scrollIntoView();}
function saveExpense(e){e.preventDefault();const old=data.expenses.slice(),v=Object.fromEntries(new FormData(e.target));if(expenseEdit===null)data.expenses.unshift({...v,id:crypto.randomUUID()});else data.expenses[expenseEdit]={...data.expenses[expenseEdit],...v};if(save()){budgetYear=v.date.slice(0,4);budgetMonth='';show('budget');}else data.expenses=old;}
function deleteExpense(i){if(!confirm('Supprimer cette dépense ?'))return;const old=data.expenses.slice();data.expenses.splice(i,1);if(save())show('budget');else data.expenses=old;}

show('home');
</script>
</body>
</html>
